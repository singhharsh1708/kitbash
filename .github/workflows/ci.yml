name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli-os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
        working-directory: packages/cli
      - run: npm run check
        working-directory: packages/cli
      - run: npm test
        working-directory: packages/cli
      - run: node dist/index.js --version
        working-directory: packages/cli
      - name: Benchmark is deterministic and its committed output is fresh
        # Linux-only: CRLF working trees would skew the measured token counts.
        if: runner.os == 'Linux'
        run: npm run bench --prefix packages/cli && git diff --exit-code docs/benchmarks/README.md

  # Aggregator keeping the required status-check name "cli" stable across the OS matrix.
  cli:
    needs: cli-os
    runs-on: ubuntu-latest
    steps:
      - run: echo "cli passed on all platforms"

  # Dogfood the SARIF path on our own flagship skill. Uses the locally built CLI
  # rather than the published action: at PR time npm has not seen this version yet.
  skills:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
        working-directory: packages/cli
      - run: npm run build
        working-directory: packages/cli
      - name: Lint the example skill, emitting SARIF
        run: node packages/cli/dist/index.js lint examples/skills/prereview --strict --sarif kitbash.sarif
      - name: Upload findings to code scanning
        # Runs even when the lint fails — a failing run is exactly the one whose
        # findings need to reach the Security tab.
        if: always() && hashFiles('kitbash.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: kitbash.sarif

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate JSON schema is well-formed
        run: node -e "JSON.parse(require('fs').readFileSync('spec/schema/skill.schema.json','utf8')); console.log('schema ok')"
      - name: Committed site output is current
        # build.mjs stamps the CLI version and renders CHANGELOG.md into the site,
        # and its output is committed — a stale commit ships a wrong version badge.
        run: node site/build.mjs --check
